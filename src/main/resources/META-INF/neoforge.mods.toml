modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    authors="${mod_authors}"
    description='''
Advanced block-change logging and rollback mod for NeoForge 1.21.1.
Right-click with a wooden pickaxe to inspect block history.
Use /lb commands for advanced queries and rollback.
Author: Neo (Neonekpro).
'''

[[dependencies.logblock]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.logblock]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
